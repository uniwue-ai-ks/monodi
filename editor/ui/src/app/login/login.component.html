<div class="container">
  <form (ngSubmit)="onSubmit()">
    <div class="row mt-5">
      <div class="col form-group">
        <label>Nutzername:</label>
        <input type="email" name="mail" [(ngModel)]="mail" class="form-control" />
      </div>
    </div>
    <div class="row">
      <div class="col form-group">
        <label>Password:</label>
        <input name="password" type="password" [(ngModel)]="password" class="form-control" />
      </div>
    </div>
    <div class="row">
      <div class="col form-group">
        <input type="submit" class="btn btn-outline-primary" value="Login">
      </div>
    </div>
  </form>
</div>

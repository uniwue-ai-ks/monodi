publish_dev:
 script:
  - sudo /root/ci/publish_to.sh dev dev dev devapi https://devapi.corpus-monodicum.de/tdb2-database/query?query= https://devapi.corpus-monodicum.de/tdb2-databasei/query?query= https://devdata.corpus-monodicum.de/
